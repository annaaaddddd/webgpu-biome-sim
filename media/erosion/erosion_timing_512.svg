<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 364" width="640" height="364" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<style>
  .bg{fill:#fcfcfb} .title{fill:#0b0b0b;font-size:15px;font-weight:600} .sub{fill:#52514e;font-size:12px}
  .name{fill:#0b0b0b;font-size:12px} .val{fill:#52514e;font-size:12px} .tick{fill:#7a7974;font-size:11px}
  .bar{fill:#2a78d6} .bar.muted{fill:#a3a29c} .whisker{stroke:#52514e;stroke-width:1.5}
  .grid{stroke:#e6e5e1;stroke-width:1} .sep{stroke:#d6d5d0;stroke-width:1;stroke-dasharray:3 3}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19} .title,.name{fill:#f0efec} .sub,.val{fill:#c3c2b7} .tick{fill:#9a998f}
    .bar{fill:#3987e5} .bar.muted{fill:#6b6a64} .whisker{stroke:#c3c2b7} .grid{stroke:#2e2e2c} .sep{stroke:#3a3a37}
  }
</style>
<rect class="bg" width="100%" height="100%" rx="8"/>
<text class="title" x="16" y="26">GPU time per erosion pass, 512 x 512 grid</text>
<text class="sub" x="16" y="45">One sim step (6 passes): 120 us median over 300 samples.</text>
<text class="sub" x="16" y="62">Bar = median, whisker = p95. Export runs once per frame, not per step.</text>
